<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images et figures HTML</title>
</head>
<body>

    <h1>Images et figures HTML</h1>
    <p>Une image permet d'afficher un contenu visuel dans une page HTML.</p>

    <img src="IMG/IMG1.jpg" alt="Portrait d'un développeur" width="120" height="120">

    <figure>
        <img src="IMG/IMG2.jpg" alt="Développeur écrivant du code">
        <figcaption>Le développeur écrit le code de l'application.</figcaption>
    </figure>

</body>
</html>
